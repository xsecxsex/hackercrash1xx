<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09070d">
  <meta name="color-scheme" content="dark">
  <title>LION Admin</title>
  <style>
    :root{color-scheme:dark;forced-color-adjust:none;--bg:#09070d;--card:#17111f;--line:#3b253f;--red:#e10031;--gold:#d4af37;--text:#f7eef7;--muted:#b8a9bb;--green:#36d98b}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#29101e 0,#09070d 48%);color:var(--text);font-family:Arial,Tahoma,sans-serif;min-height:100vh}
    .wrap{width:min(980px,94vw);margin:auto;padding:34px 0 60px}.brand{text-align:center;color:var(--red);font-size:2.4rem;font-weight:900;letter-spacing:12px}.sub{text-align:center;color:var(--gold);letter-spacing:5px;font-size:.72rem;margin:8px 0 30px}.panel{background:rgba(23,17,31,.94);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 16px 50px #0008}.login{max-width:420px;margin:70px auto}.title{color:var(--gold);font-weight:800;font-size:1.2rem;margin-bottom:18px}.input,.select{width:100%;padding:14px;margin:7px 0;background:#0d0a12;color:var(--text);border:1px solid var(--line);border-radius:12px;outline:none}.btn{border:0;border-radius:12px;padding:13px 18px;cursor:pointer;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--red),#97001f);margin-top:12px}.btn.gold{background:linear-gradient(135deg,#d4af37,#8e6813);color:#120d08}.btn.gray{background:#302536}.btn.danger{background:#7d0824}.error{color:#ff718f;min-height:22px;margin-top:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.orders{display:grid;gap:16px}.order{background:#0e0a13;border:1px solid var(--line);border-radius:18px;padding:16px}.order.approved{border-color:#1e734e}.meta{line-height:1.9;color:#eee}.meta b{color:var(--gold)}.proof{width:100%;max-height:420px;object-fit:contain;background:#050406;border-radius:12px;margin:12px 0;cursor:zoom-in}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>.btn{margin-top:0}.code{font-family:monospace;direction:ltr;background:#071b12;color:var(--green);border:1px solid #1d8558;border-radius:10px;padding:12px;text-align:center;font-size:1.15rem;margin-top:12px}.empty{text-align:center;color:var(--muted);padding:30px}.small{color:var(--muted);font-size:.82rem}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-card{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.close{border:0;background:#302536;color:#fff;border-radius:10px;padding:9px 13px;cursor:pointer;font-size:1.1rem}.hint{color:var(--muted);font-size:.8rem;margin:5px 0 12px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">LION</div><div class="sub">ADMIN CONTROL</div>
  <section id="login" class="panel login">
    <div class="title">دخول لوحة التحكم</div>
    <input id="username" class="input" autocomplete="username" placeholder="اسم المستخدم">
    <input id="password" class="input" type="password" autocomplete="current-password" placeholder="كلمة المرور">
    <button class="btn" id="loginBtn">دخول الإدارة</button><div id="loginError" class="error"></div>
  </section>
  <section id="dashboard" class="hidden">
    <div class="panel">
      <div class="top"><div><div class="title" style="margin:0">الطلبات الواردة</div><div class="small">اضغط تأكيد لتوليد كود بمدة الباقة بالضبط وإرسال الكود إلى البوت.</div></div><div class="row"><button class="btn gold" id="addBtn">＋ إضافة طلب</button><button class="btn gray" id="logoutBtn">خروج</button></div></div>
      <div id="orders" class="orders"><div class="empty">جاري تحميل الطلبات...</div></div>
    </div>
  </section>
</div>
<section id="addModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><div class="title" style="margin:0">إضافة طلب يدوي</div><button class="close" id="closeModal">×</button></div>
    <div class="hint">الطلب اليدوي يُحفظ في قائمة الطلبات، ويمكنك تأكيده لاحقاً لإصدار الكود وإرساله للبوت.</div>
    <select id="mProduct" class="select"><option value="plane">✈️ الطيارة</option><option value="apple">🍎 التفاحة</option></select>
    <input id="mItem" class="input" placeholder="اسم الباقة، مثال: كود لمدة نصف ساعة">
    <div class="row"><input id="mMinutes" class="input" type="number" min="1" placeholder="المدة بالدقائق" style="flex:1"><input id="mPrice" class="input" type="number" min="0" placeholder="السعر بالجنيه" style="flex:1"></div>
    <input id="mTg" class="input" placeholder="Telegram Username، مثال @username">
    <input id="mNum" class="input" placeholder="رقم التحويل">
    <input id="mImg" class="input" type="file" accept="image/*">
    <div class="row"><button class="btn gold" id="saveManual">حفظ الطلب</button><button class="btn gray" id="cancelManual">إلغاء</button></div>
    <div id="manualError" class="error"></div>
  </div>
</section>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig={databaseURL:'https://zoomelbet-bc9fd-default-rtdb.europe-west1.firebasedatabase.app/'};
  firebase.initializeApp(firebaseConfig); const db=firebase.database();
  const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const label=p=>p==='plane'?'✈️ الطيارة':'🍎 التفاحة';
  $('loginBtn').onclick=()=>{if($('username').value.trim()==='dark'&&$('password').value==='dark'){sessionStorage.admin='1';showDashboard()}else $('loginError').textContent='بيانات الدخول غير صحيحة'};
  $('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()}; $('logoutBtn').onclick=()=>{sessionStorage.removeItem('admin');location.reload()};
  $('addBtn').onclick=()=>{$('addModal').classList.remove('hidden');$('manualError').textContent=''};
  $('closeModal').onclick=$('cancelManual').onclick=()=>{$('addModal').classList.add('hidden')};
  function showDashboard(){ $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');loadOrders() }
  function code(){const a=new Uint32Array(2);crypto.getRandomValues(a);return 'GLITCH-'+Array.from(a).map(n=>n.toString(36).toUpperCase()).join('').slice(-10)}
  function render(snap){const root=$('orders');if(!snap.exists()){root.innerHTML='<div class="empty">لا توجد طلبات حتى الآن</div>';return}let html='';snap.forEach(c=>{const o=c.val()||{},ok=o.status==='approved';html+=`<article class="order ${ok?'approved':''}"><div class="meta">📦 <b>${label(o.product)} · ${esc(o.item)}</b><br>⏱ المدة: ${esc(o.minutes)} دقيقة<br>💰 السعر: ${esc(o.price)} EGP<br>👤 Telegram: ${esc(o.tg)}<br>📞 رقم التحويل: ${esc(o.num)}<br><span class="small">رقم الطلب: ${esc(c.key)}</span></div>${o.img?`<img class="proof" src="${esc(o.img)}" onclick="window.open(this.src,'_blank')">`:''}${ok?`<div class="code">${esc(o.activationCode)}<br><span class="small">ينتهي: ${new Date(o.expiry).toLocaleString('ar-EG')}</span></div>`:`<button class="btn gold" onclick="approve('${esc(c.key)}')">✅ تأكيد وتوليد الكود</button>`}<button class="btn danger" style="width:100%;margin-top:10px" onclick="deleteOrder('${esc(c.key)}')">🗑 حذف الطلب</button></article>`});root.innerHTML=html}
  function loadOrders(){db.ref('orders').on('value',render,()=>{$('orders').innerHTML='<div class="empty">تعذر تحميل الطلبات. راجع إعدادات Firebase.</div>'})}
  async function approve(id){const ref=db.ref('orders/'+id),s=await ref.once('value'),o=s.val();if(!o||o.status==='approved')return;const c=code(),expiry=new Date(Date.now()+Number(o.minutes||30)*60000).toISOString();await db.ref('keys/'+c).set({users:1,expiry,product:o.product||'apple',telegram:o.tg,orderId:id});await ref.update({status:'approved',activationCode:c,expiry});try{const r=await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:id,tg:o.tg,num:o.num,item:o.item,price:o.price,minutes:o.minutes,product:o.product,code:c,expiry})});if(!r.ok)throw new Error('api');alert('تم التأكيد وتوليد الكود وإرساله للبوت')}catch(e){alert('تم توليد الكود وحفظه، لكن تعذر إرسال رسالة الكود للبوت. تأكد من إعدادات Vercel.')}}
  async function deleteOrder(id){if(!confirm('هل تريد حذف هذا الطلب نهائياً؟'))return;try{const s=await db.ref('orders/'+id).once('value'),o=s.val()||{};const tasks=[db.ref('orders/'+id).remove()];if(o.activationCode)tasks.push(db.ref('keys/'+o.activationCode).remove());await Promise.all(tasks);alert('تم حذف الطلب')}catch(e){alert('تعذر حذف الطلب')}}
  function resetManual(){['mItem','mMinutes','mPrice','mTg','mNum'].forEach(id=>$(id).value='');$('mImg').value='';$('manualError').textContent=''}
  $('saveManual').onclick=()=>{const product=$('mProduct').value,item=$('mItem').value.trim(),minutes=Number($('mMinutes').value),price=Number($('mPrice').value),tg=$('mTg').value.trim(),num=$('mNum').value.trim(),file=$('mImg').files[0];if(!item||!minutes||price<0||!tg||!num){$('manualError').textContent='أكمل اسم الباقة والمدة والسعر وTelegram ورقم التحويل';return}const save=img=>db.ref('orders').push({product,item,minutes,price,tg,num,img:img||'',status:'pending',sentToTelegram:false,manual:true,createdAt:Date.now()}).then(()=>{$('addModal').classList.add('hidden');resetManual();alert('تمت إضافة الطلب')}).catch(()=>{$('manualError').textContent='تعذر حفظ الطلب'});if(file){if(file.size>4*1024*1024){$('manualError').textContent='حجم الصورة أكبر من 4MB';return}const reader=new FileReader();reader.onload=()=>save(reader.result);reader.readAsDataURL(file)}else save('')};
  if(sessionStorage.admin==='1')showDashboard();
</script>
</body>
</html>
